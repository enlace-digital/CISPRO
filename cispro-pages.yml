name: Publicar CISPRO desde Drive

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cispro-pages
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Buscar y descargar los documentos por numeral
        env:
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
        run: python3 .github/sync_drive.py _site

      - name: Preparar publicación
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar sitio
        id: deploy
        uses: actions/deploy-pages@v4
